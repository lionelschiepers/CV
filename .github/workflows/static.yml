name: Deploy CV to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
      - 'features/**'

  pull_request:
    branches: 
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:



# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  Build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  Lighthouse:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Build size check
        run: |
          size=$(du -sb ./dist | cut -f1)
          echo "Build size: $size"
          if [ $(echo "$size > 1000000" | bc -l) -eq 1 ]; then
            echo "::warning::Build size exceeds 1MB: $size"
          fi
      - name: Install Lighthouse CLI
        run: npm install -g --ignore-scripts @lhci/cli@0.15.1
      - name: Run Lighthouse CI
        run: lhci autorun --config=./lighthouserc.js --verbose
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
      - name: Comment PR with Lighthouse scores
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const subDir = '.lighthouseci/';
            const reports = fs.readdirSync(subDir).filter(f => f.includes('lhr-') && f.includes('.json'));
            
            console.log('Found: ' + reports.length + ' reports');
            
            if (reports.length > 0) {
              console.log('Processing : ' + reports[reports.length - 1]);
              const report = JSON.parse(fs.readFileSync(subDir + reports[reports.length - 1], 'utf8'));
              const scores = {
                performance: Math.round(report.categories.performance.score * 100),
                accessibility: Math.round(report.categories.accessibility.score * 100),
                bestPractices: Math.round(report.categories['best-practices'].score * 100),
                seo: Math.round(report.categories.seo.score * 100)
              };
              
              const comment = `## Lighthouse Performance Report
              
              | Category | Score |
              |----------|-------|
              | Performance | ${scores.performance}/100 |
              | Accessibility | ${scores.accessibility}/100 |
              | Best Practices | ${scores.bestPractices}/100 |
              | SEO | ${scores.seo}/100 |
              
              ${scores.performance >= 90 ? '✅' : '⚠️'} Performance is ${scores.performance >= 90 ? 'excellent' : 'good'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  Deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [Build, Lighthouse]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

